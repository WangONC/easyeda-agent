# air live-reload config for the easyeda-agent daemon.
#   make dev   (or: air)
# Rebuilds .easyeda/tmp-builds/easyeda.exe and restarts its daemon. The EasyEDA
# connector reconnects to 60832 in the background, so it auto-reconnects to
# the freshly restarted daemon with no manual Reconnect.
#   install air:  go install github.com/air-verse/air@latest
root = "."
tmp_dir = ".easyeda/tmp-builds"

[build]
  # Temporary development binary only; formal bin/easyeda.exe is untouched.
  cmd = "make dev-build"
  bin = "./.easyeda/tmp-builds/easyeda.exe"
  # Development must not overwrite the checked-out Skill with an older release.
  args_bin = ["daemon","start","--auto-update-skill=false"]
  # only watch Go sources of the daemon/CLI; ignore the connector, tools, docs
  include_ext = ["go"]
  include_dir = ["cmd", "internal"]
  exclude_dir = ["bin", "tmp", ".easyeda", "testdata", "extension", "tools", "docs", "skills"]
  exclude_regex = ["_test\\.go"]
  # debounce a burst of saves; SIGINT for graceful shutdown (daemon handles it),
  # then hard-kill after the delay if it hasn't exited.
  delay = 800
  send_interrupt = true
  kill_delay = "2s"
  stop_on_error = true
  log = "build-errors.log"

[misc]
  clean_on_exit = true

[screen]
  clear_on_rebuild = false
  keep_scroll = true
